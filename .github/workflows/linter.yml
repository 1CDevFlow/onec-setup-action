name: Lint Codebase

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Dependencies
        id: install
        run: pnpm install

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Check Format
        run: pnpm run format:check
